{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
</head>
<body>

    <h1>Recent Posts</h1>

    {% for post in posts%}
    <div class="post">
        <h2 class="post-title">{{ post.title }}</h2>
        <p class="post-date">{{ post.created_at }}</p>
        <p class="post-content">{{ post.description }}</p>
        <img src="{% static "{{post.cover.url}}" %}" alt="post-cover">
    </div>
    {% endfor %}    
</body>
</html>
